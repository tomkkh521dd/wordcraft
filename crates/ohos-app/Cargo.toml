[package]
name = "wordcraft-ohos-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft for HarmonyOS NEXT, without the C ABI: the egui UI on a native surface, input, and configuration"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-fonts = { workspace = true }
# The same UI the desktop and the browser draw, driven without winit/eframe.
wordcraft-ui-egui = { workspace = true }
# Rasterised on the CPU, since HarmonyOS gets no GPU context here.
wordcraft-ui-paint = { path = "../ui-paint" }
# egui's own fallback faces (Ubuntu-Light, Noto Emoji, the emoji icon font): the interface font
# families are built from `FontDefinitions::default()`, which holds nothing without this feature.
# `wordcraft-ui-egui` already pulls egui with its default features (as eframe does on the desktop),
# so this line only states the requirement where the app is assembled.
egui = { workspace = true, features = ["default_fonts"] }
# The settings folder the shell gives us (app sandbox) and its control-key file layout.
wordcraft-control-key = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
